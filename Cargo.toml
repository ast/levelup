[workspace]
resolver = "3"
members = [
    "levelup-core",
    "levelup-tui",
    "hugin",
    "munin",
    "mimir",
    "sleipnir",
    "valkyrie",
    "heimdall",
    "gorm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sd-notify = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
ratatui = "0.29"
crossterm = "0.28"
toml = { version = "0.8", default-features = false, features = ["parse"] }
nucleo-matcher = "0.3"
nom = "8"
chrono-tz = "0.10"
nix = "0.29"
shlex = "1"
ignore = "0.4"
# Pure-Rust regex (fancy-regex) so there's no oniguruma C build; the embedded
# syntax/theme dumps load lazily (~23ms once) and add ~200KB.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Network device discovery (heimdall): local interface enumeration + bundled OUI db.
if-addrs = "0.13"
mac_oui = { version = "0.4", features = ["with-db"] }
mdns-sd = "0.11"
# Bluetooth device management (gorm): typed BlueZ binding over D-Bus. Links
# libdbus via the `dbus` crate, so building needs `libdbus-1-dev` + pkg-config.
bluer = { version = "0.17", features = ["bluetoothd"] }

[profile.release]
lto = "thin"
codegen-units = 1
