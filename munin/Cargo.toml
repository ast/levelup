[package]
name = "munin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "munind"
path = "src/bin/munind.rs"

[[bin]]
name = "munin"
path = "src/bin/munin.rs"

[dependencies]
levelup-core = { path = "../levelup-core" }
